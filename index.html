.mu{color:var(--mu)}.sm{font-size:13px}

.bar{height:5px;background:var(--bd);border-radius:4px;margin-top:8px;overflow:hidden}

.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-top:14px}
.chk .card{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.main>.card{overflow:auto;min-height:0}
.f{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--bd);align-items:start}
.f:last-child{border:0}.f>span:first-child{color:var(--mu);font-size:13px;padding-top:2px}
.v{word-break:break-word;display:flex;align-items:flex-start}
.title{font-weight:600;font-size:17px}
.tag{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;background:var(--bd)}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.wr{background:var(--wrb);color:var(--wr)}
.dh{padding:8px 12px;border-radius:8px;background:var(--wrb);color:var(--wr);margin-bottom:8px}
.dh.none{background:var(--okb);color:var(--ok)}
.it{border:1px solid var(--bd);border-radius:8px;padding:7px 10px;margin-bottom:6px;background:var(--soft)}
.it .l{font-weight:600;margin-bottom:2px}
.it .r{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:14px}
.oc{background:var(--okb);border:1px solid var(--ok);border-radius:8px;padding:8px 12px;margin-bottom:12px}.ocv{display:flex;align-items:center;font-size:17px;margin-top:2px}
.res{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.res button.on{color:#fff;border-color:transparent}
.res .r1.def{border:1.5px dashed var(--ok);color:var(--ok)}.res .r1.on{background:var(--ok)}.res .r2.on{background:var(--er)}.res .r3.on{background:var(--wr)}
.ft{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.ft input{flex:1;min-width:160px;font:inherit;background:var(--soft);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
.jump{display:flex;gap:3px;overflow-x:auto;padding:4px 0 2px}
.jump button{padding:0 7px;font-size:12px;border-radius:6px;flex:none;min-width:26px}.jump .d{background:var(--okb);border-color:var(--ok)}.jump .a{opacity:.55;border-style:dashed}.jump .c{outline:2px solid var(--pr)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#3a4250;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:820px){.wrap.chk{height:auto}.main{grid-template-columns:1fr}.main>.card{overflow:visible}.f{grid-template-columns:1fr}}

async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=u8.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('ไม่ใช่ไฟล์ xlsx');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    if(!/^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/[^/]+\.xml)$/.test(name))continue;
    const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),raw=u8.subarray(ds,ds+cs);
    let txt;
    if(m===0)txt=new TextDecoder().decode(raw);
    else{const s=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));txt=await new Response(s).text()}
    out[name]=txt}
  return out}

async function parseXlsx(file){
  const z=await unzip(await file.arrayBuffer());
  const wb=xml(z['xl/workbook.xml']),sh=wb.getElementsByTagName('sheet')[0];
  const rid=sh.getAttribute('r:id'),rels=xml(z['xl/_rels/workbook.xml.rels']);
  let target='worksheets/sheet1.xml';
  for(const r of rels.getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid)target=r.getAttribute('Target').replace(/^\/?(xl\/)?/,'');
  const ss=[];if(z['xl/sharedStrings.xml'])for(const si of xml(z['xl/sharedStrings.xml']).getElementsByTagName('si'))ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  const sheet=xml(z['xl/'+target]),rows=[];
  for(const row of sheet.getElementsByTagName('row')){
    const arr=[];
    for(const c of row.getElementsByTagName('c')){
      const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
      if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else if(v){val=t==='s'?ss[+v.textContent]:v.textContent}
      arr[colIdx(c.getAttribute('r'))]=String(val??'').trim()}
    rows.push(arr)}
  const head=(rows[0]||[]).map(h=>(h||'').trim());
  const ix=n=>head.indexOf(n);
  const need=['CTRLNO','TITLE','LIBRARY_LOCATION'];const miss=need.filter(n=>ix(n)<0);
  if(miss.length)throw new Error('ไม่พบหัวคอลัมน์: '+miss.join(', '));
  const g=(r,n)=>ix(n)<0?'':(r[ix(n)]??'');
  const data=[];
  rows.slice(1).forEach((r,i)=>{if(!g(r,'CTRLNO'))return;
    data.push({no:g(r,'ลำดับ')||String(i+1),ctrl:g(r,'CTRLNO'),title:g(r,'TITLE'),call:g(r,'CALL_NO'),year:g(r,'PUBLISHING_YEAR'),type:g(r,'MATERIAL_TYPE'),lib:g(r,'LIBRARY_LOCATION'),t999:g(r,'tag999'),a035:g(r,'เพิ่ม 035'),out035:g(r,'เพิ่ม 035 นอกรายการ'),note:g(r,'หมายเหตุ')})});
  if(!data.length)throw new Error('ไม่พบข้อมูลในไฟล์');
  return data}

  if(!others.length)return`<div class="dh none">✓ ชื่อเรื่องนี้ไม่ซ้ำกับรายการอื่น</div>`;
  const diff=[...new Set(others.filter(x=>x.lib!==r.lib).map(x=>x.lib))],same=others.filter(x=>x.lib===r.lib).length;
  return`<div class="dh"><b>⚠ ชื่อเรื่องซ้ำ ${others.length} รายการ</b>${diff.length?` · ห้องสมุดอื่น: <b>${diff.map(esc).join(', ')}</b>`:''}${same?` · ห้องเดียวกัน ${same}`:''}</div>`+(diff.length?`<div class="sm mu" style="margin:-2px 0 8px">เมื่อกด "ตรวจแล้ว" จะถือว่าตรวจรายการของห้องสมุดอื่น (${diff.map(esc).join(', ')}) พร้อมกัน และข้ามรายการเหล่านั้นเมื่อตรวจห้องนั้น</div>`:'')+
  others.map(x=>`<div class="it"><div class="l">${esc(x.lib)}${x.lib===r.lib?' <span class="tag wr">ห้องเดียวกัน</span>':''} <span class="mu sm" style="font-weight:400">CTRLNO ${esc(cn(x.ctrl))}</span></div>
  <div class="r"><span class="mu">เพิ่ม 035: <b style="color:var(--tx)">${esc(x.a035)||'-'}</b></span><span class="mu">เพิ่ม 035 นอกรายการ: <b style="color:var(--tx)">${esc(x.out035)||'-'}</b></span></div></div>`).join('');
}
function show(){
  const rows=byLib[lib],r=rows[idx],st=S.res[r.no]||{};S.cur[lib]=idx;save();
  const isDup=(byTitle[norm(r.title)]||[]).some(x=>x.no!==r.no);const oc=isDup?'(OCoLC)bib':'(OCoLC)bib'+cn(r.ctrl);
  window._cp=[clean(r.title),r.call,cn(r.ctrl),oc];
  const d=doneCount(lib),last=idx===rows.length-1;
  app.className='wrap chk';
  app.innerHTML=`<div><div class="top"><button onclick="home()">← เลือกห้องสมุด</button><div><b>${esc(lib)}</b> · รายการที่ ${idx+1}/${rows.length} · ตรวจแล้ว ${d}</div></div>
  <div class="jump">${rows.map((x,i)=>`<button class="${S.res[x.no]?.done?'d':''} ${S.res[x.no]?.auto?'a':''} ${i==idx?'c':''}" onclick="idx=${i};show()" title="${esc(cn(x.ctrl))}${S.res[x.no]?.auto?' (ตรวจพร้อมกับ '+esc(S.res[x.no].auto)+')':''}">${i+1}</button>`).join('')}</div></div>
  <div class="card ft"><h2>ผลการตรวจ</h2>
   <div class="res">${[['ถูกต้อง','r1'],['ผิด','r2'],['ต้องตรวจสอบ','r3']].map(([t,c])=>`<button class="${c} ${st.result===t?'on':''} ${!st.result&&t==='ถูกต้อง'?'def':''}" ${!st.result&&t==='ถูกต้อง'?'title="ค่าเริ่มต้น: ถ้ากดถัดไปเลยจะบันทึกเป็นถูกต้อง"':''} onclick="setRes('${t}')">${t}</button>`).join('')}</div>
   <input id="nt" placeholder="หมายเหตุการตรวจ (ถ้ามี)" value="${esc(st.note||'')}" oninput="setNote(this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();next()}">
   <button onclick="go(-1)" ${idx==0?'disabled':''}>← ก่อนหน้า</button>
   <button class="pr" onclick="next()">${last?'เสร็จห้องสมุดนี้ ✓':'ตรวจแล้ว · ถัดไป →'}</button></div>
  <div class="main">
   <div class="card">
    <div class="mu sm">ลำดับ ${esc(r.no)} ${st.done?'<span class="tag ok">ตรวจแล้ว'+(st.auto?' (พร้อมกับ '+esc(st.auto)+')':'')+'</span>':''}</div>
    <div class="f"><span>CTRLNO</span><span class="v"><button class="cp" onclick="cpy(2)">คัดลอก</button><b>${esc(cn(r.ctrl))}</b></span></div>
    <div class="f"><span>TITLE</span><span class="v"><button class="cp" onclick="cpy(0)">คัดลอก</button><span class="title">${esc(clean(r.title))}</span></span></div>
    <div class="f"><span>CALL_NO</span><span class="v">${r.call?'<button class="cp" onclick="cpy(1)">คัดลอก</button>':''}<span>${esc(r.call)||'-'}</span></span></div>
    <div class="f"><span>PUBLISHING_YEAR</span><span class="v">${esc(r.year)||'-'}</span></div>
    <div class="f"><span>เพิ่ม 035</span><span class="v">${esc(r.a035)||'-'}&nbsp;<span class="mu sm">(tag999: ${esc(r.t999)||'-'})</span></span></div>
    <div class="f"><span>เพิ่ม 035 นอกรายการ</span><span class="v">${esc(r.out035)||'-'}</span></div>
    <div class="f"><span>หมายเหตุ</span><span class="v">${esc(r.note)||'-'}</span></div>
   </div>
   <div class="card"><div class="oc"><span class="mu sm">ข้อความ 035</span><div class="ocv"><button class="cp" onclick="cpy(3)">คัดลอก</button><b>${esc(oc)}</b></div></div><h2 style="margin-bottom:8px">ชื่อเรื่องซ้ำ</h2>${dupHtml(r)}</div>
  </div>`;
}
window.setRes=t=>{const r=byLib[lib][idx];const o=S.res[r.no]??={};const PRE='เพิ่ม035ที่ ';
  o.result=o.result===t?'':t;
  if(o.result==='ผิด'&&!(o.note||'').trim())o.note=PRE;
  else if(o.result!=='ผิด'&&o.note===PRE)o.note='';
  save();show();
  if(o.result==='ผิด'){const i=document.getElementById('nt');i.focus();i.setSelectionRange(i.value.length,i.value.length)}};
window.setNote=v=>{const r=byLib[lib][idx];(S.res[r.no]??={}).note=v;save()};
window.go=n=>{idx=Math.max(0,Math.min(byLib[lib].length-1,idx+n));show()};
const linked=r=>(byTitle[norm(r.title)]||[]).filter(x=>x.no!==r.no&&x.lib!==r.lib);
window.next=()=>{const rows=byLib[lib],r=rows[idx];const o=S.res[r.no]??={};if(!o.result)o.result='ถูกต้อง';if(o.note)o.note=o.note.trim();o.done=true;o.at=new Date().toISOString();
  let n=0;linked(r).forEach(x=>{const y=S.res[x.no]??={};if(!y.done){y.done=true;y.auto=lib;y.at=o.at;y.result=o.result||'';y.note=o.note||'';n++}});
  save();if(n)toast('ถือว่าตรวจพร้อมกันอีก '+n+' รายการในห้องสมุดอื่น');
  let f=rows.findIndex((x,i)=>i>idx&&!S.res[x.no]?.done);
  if(f>=0){idx=f;show();return}
  f=rows.findIndex(x=>!S.res[x.no]?.done);
  if(f>=0&&confirm('ยังมีรายการก่อนหน้าที่ยังไม่ได้ตรวจในห้องสมุดนี้ ไปที่รายการนั้นหรือไม่?')){idx=f;show();return}
  if(f<0){S.cur[lib]=0;save();finish();return}
  S.cur[lib]=0;save();finish()};
function finish(){
  app.className='wrap';
  const rows=byLib[lib],own=rows.filter(r=>S.res[r.no]?.done&&!S.res[r.no]?.auto),viaOther=rows.filter(r=>S.res[r.no]?.auto);
  const from={};viaOther.forEach(r=>{const k=S.res[r.no].auto;from[k]=(from[k]||0)+1});
  const toOther=DATA.filter(r=>r.lib!==lib&&S.res[r.no]?.auto===lib),to={};toOther.forEach(r=>to[r.lib]=(to[r.lib]||0)+1);
  const fmt=o=>Object.entries(o).map(([k,v])=>`${esc(k)} ${v}`).join(' · ');
  const nx=libs.find(l=>doneCount(l)<byLib[l].length);
  app.innerHTML=`<div class="card" style="max-width:640px;margin:30px auto"><h1 style="text-align:center">✓ ตรวจ ${esc(lib)} เสร็จแล้ว</h1>
  <div class="f" style="grid-template-columns:1fr auto"><span style="font-size:15px;color:var(--tx)">ห้องสมุดนี้ (${esc(lib)}) ทั้งหมด</span><b>${rows.length} รายการ</b></div>
  <div class="f" style="grid-template-columns:1fr auto"><span style="font-size:15px;color:var(--tx)">ตรวจในห้องสมุดนี้เอง</span><b>${own.length} รายการ</b></div>
  <div class="f" style="grid-template-columns:1fr auto"><span style="font-size:15px;color:var(--tx)">ถูกตรวจไปแล้วพร้อมห้องสมุดอื่น (ข้าม)${viaOther.length?`<br><span class="sm mu">${fmt(from)}</span>`:''}</span><b>${viaOther.length} รายการ</b></div>
  <div class="f" style="grid-template-columns:1fr auto"><span style="font-size:15px;color:var(--tx)">การตรวจครั้งนี้ครอบคลุมห้องสมุดอื่นด้วย${toOther.length?`<br><span class="sm mu">${fmt(to)}</span>`:''}</span><b>${toOther.length} รายการ</b></div>
  <div style="text-align:center;margin-top:18px">${nx?`<button class="pr" onclick="openLib('${nx}')">ไปห้องสมุดถัดไป: ${esc(nx)} →</button> `:'<p><b>ตรวจครบทุกห้องสมุดแล้ว 🎉</b></p>'}
  <button onclick="home()">เลือกห้องสมุดเอง</button> <button onclick="exp()">ส่งออกผลตรวจ (CSV)</button></div></div>`;
}
window.exp=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const h=['ลำดับ','CTRLNO','TITLE','CALL_NO','PUBLISHING_YEAR','LIBRARY_LOCATION','เพิ่ม 035','เพิ่ม 035 นอกรายการ','หมายเหตุ','ตรวจแล้ว','ผลการตรวจ','หมายเหตุการตรวจ','วันที่ตรวจ','ตรวจพร้อมกับห้อง'];
  const l=DATA.map(r=>{const s=S.res[r.no]||{};return[r.no,r.ctrl,r.title,r.call,r.year,r.lib,r.a035,r.out035,r.note,s.done?'Y':'',s.result||'',s.note||'',s.at?s.at.slice(0,10):'',s.auto||''].map(q).join(',')});
  const b=new Blob(['﻿'+[h.map(q).join(','),...l].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ผลตรวจ_'+store.current.replace(/\.xlsx$/i,'')+'.csv';a.click();
};
window.rst=()=>{if(confirm('ล้างความคืบหน้าและผลตรวจของไฟล์นี้?')){S.res={};S.cur={};save();home()}};
document.addEventListener('keydown',e=>{if(!lib||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'&&document.querySelector('.nav .pr'))next();if(e.key==='ArrowLeft')go(-1)});
setFile(store.current);home();
</script></body></html>
